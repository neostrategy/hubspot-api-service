name: Deploy hubspot-api-service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::365502632637:role/hubspot-api-deploy-role
          aws-region: sa-east-1
          

      - name: SAM build
        run: sam build

      - name: SAM deploy
        run: >
          sam deploy
          --stack-name hubspot-api-service
          --no-confirm-changeset
          --no-fail-on-empty-changeset
          --capabilities CAPABILITY_IAM
          --resolve-s3
          --parameter-overrides HubspotToken=${{ secrets.HUBSPOT_TOKEN }}
